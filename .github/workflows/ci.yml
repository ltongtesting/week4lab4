name: Java CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, sonarqube]

    steps:
      - name: Extract Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize Java Development Kit 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify Secret Ingestion Layer
        env:
          DB_PASS: ${{ secrets.TEST_DATABASE_PASSWORD }}
        run: |
          echo "Initiating database testing layer connection..."
          echo "The active running password is: $DB_PASS"

      - name: Build, Resolve Dependencies, and Execute JUnit Tests
        run: mvn clean package

      - name: Compute Code Coverage Metrics
        run: mvn jacoco:report

      - name: Persist Application Binary Package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: application-package
          path: target/*.jar
          retention-days: 5

      - name: Persist Coverage Metrics Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 5
